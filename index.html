<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>猜猜我是谁</title>
<style>
  html,body{height:100%;margin:0;background:#050607;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
  /* 9:16 自适应满屏：短边贴边、长边居中留黑 */
  #game{
    width:min(100vw,56.25vh);
    height:min(100vh,177.78vw);
    image-rendering:pixelated;
  }
  #game canvas{display:block;image-rendering:pixelated}
</style>
  <script type="module" crossorigin src="./assets/index-C72wzl_v.js"></script>
</head>
<body>
  <div id="game"></div>
  <script>
    // 显式按 9:16 计算容器尺寸，避免 Phaser 启动时量到未定稿的 CSS min() 尺寸
    (function () {
      var g = document.getElementById('game');
      function fit() {
        var s = Math.min(window.innerWidth / 360, window.innerHeight / 640);
        g.style.width = Math.floor(360 * s) + 'px';
        g.style.height = Math.floor(640 * s) + 'px';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
